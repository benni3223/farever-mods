name: More Settings

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['more-settings/v*']
    paths:
      - 'more-settings/**'
      - 'shared/**'
      - '.github/workflows/build-more-settings.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'more-settings/**'
      - 'shared/**'
      - '.github/workflows/build-more-settings.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: build-more-settings-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test appearance, volume, ownership and regional presentation filters
        working-directory: more-settings
        run: haxe test.hxml
      - uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/hashlink
          ref: 04a207d73816132b9f742867e8643f58b02a5afa
          path: .combat-hashlink
          persist-credentials: false
      - name: Build the HashLink combat test runtime
        run: make -C .combat-hashlink -j2 hl
      - name: Test damage-number styling on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          mkdir -p build
          haxe -cp src -cp tests/damage-stubs -cp tests -main DamageNumbersTest -hl build/damage-numbers-test.hl
          ../.combat-hashlink/hl build/damage-numbers-test.hl
      - name: Test appearance isolation and saving on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp tests/appearance-stubs -cp tests -main AppearanceTest -hl build/appearance-test.hl
          ../.combat-hashlink/hl build/appearance-test.hl
      - name: Test Social settings on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp tests/social-stubs -cp tests -main SocialTest -hl build/social-test.hl
          ../.combat-hashlink/hl build/social-test.hl
          haxe -cp src -cp tests/social-stubs -cp tests -main SocialInteractTest -hl build/social-interact-test.hl
          ../.combat-hashlink/hl build/social-interact-test.hl
      - name: Test native event volume bridge
        working-directory: more-settings
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/event_volume_test.c -o build/event-volume-test
          build/event-volume-test

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      project: more-settings
      required-settings: true
      module: more-settings
      title: More Settings
      travel-audio: true
